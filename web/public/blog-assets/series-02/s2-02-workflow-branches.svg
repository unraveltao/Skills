<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1460" role="img" aria-labelledby="title desc">
  <title id="title">Issue-to-PR workflow branches</title>
  <desc id="desc">A vertical workflow shows the normal path and explicit outcomes for missing context, an already-fixed issue, an unsupported cause, and failed verification.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4778f5"/>
    </marker>
  </defs>
  <rect width="640" height="1460" rx="28" fill="#f3f6fb"/>
  <text x="40" y="56" fill="#4778f5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="750" letter-spacing="2">WORKFLOW MODEL</text>
  <text x="40" y="100" fill="#17243b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="29" font-weight="700">One main route, explicit branches</text>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="50" y="130" width="540" height="76" rx="16" fill="#fff" stroke="#cfd9ea" stroke-width="2"/>
    <text x="320" y="178" text-anchor="middle" fill="#17243b" font-size="25" font-weight="700">Read the Issue</text>
    <path d="M320 207 V231" stroke="#4778f5" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="40" y="240" width="560" height="188" rx="18" fill="#fff" stroke="#cfd9ea" stroke-width="2"/>
    <text x="64" y="278" fill="#17243b" font-size="24" font-weight="700">01 · Is there enough context?</text>
    <rect x="60" y="298" width="520" height="50" rx="10" fill="#e9efff"/>
    <text x="82" y="330" fill="#315ed4" font-size="21" font-weight="750">YES</text>
    <text x="152" y="330" fill="#17243b" font-size="21">Inspect the repository and reproduce.</text>
    <rect x="60" y="360" width="520" height="50" rx="10" fill="#fff7e9"/>
    <text x="82" y="392" fill="#805816" font-size="21" font-weight="750">NO</text>
    <text x="152" y="392" fill="#593e16" font-size="21">Ask a focused question; pause here.</text>
    <path d="M320 429 V453" stroke="#4778f5" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="40" y="462" width="560" height="188" rx="18" fill="#fff" stroke="#cfd9ea" stroke-width="2"/>
    <text x="64" y="500" fill="#17243b" font-size="24" font-weight="700">02 · Does the problem still occur?</text>
    <rect x="60" y="520" width="520" height="50" rx="10" fill="#e9efff"/>
    <text x="82" y="552" fill="#315ed4" font-size="21" font-weight="750">YES</text>
    <text x="152" y="552" fill="#17243b" font-size="21">Continue to root-cause analysis.</text>
    <rect x="60" y="582" width="520" height="50" rx="10" fill="#f3f6fb"/>
    <text x="82" y="614" fill="#52627b" font-size="21" font-weight="750">NO</text>
    <text x="152" y="614" fill="#17243b" font-size="21">Report the evidence; avoid duplicate work.</text>
    <path d="M320 651 V675" stroke="#4778f5" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="40" y="684" width="560" height="188" rx="18" fill="#fff" stroke="#cfd9ea" stroke-width="2"/>
    <text x="64" y="722" fill="#17243b" font-size="24" font-weight="700">03 · Is the cause supported?</text>
    <rect x="60" y="742" width="520" height="50" rx="10" fill="#e9efff"/>
    <text x="82" y="774" fill="#315ed4" font-size="21" font-weight="750">YES</text>
    <text x="152" y="774" fill="#17243b" font-size="21">Make a focused change.</text>
    <rect x="60" y="804" width="520" height="50" rx="10" fill="#fff7e9"/>
    <text x="82" y="836" fill="#805816" font-size="21" font-weight="750">NO</text>
    <text x="152" y="836" fill="#593e16" font-size="21">Investigate or report uncertainty.</text>
    <path d="M320 873 V897" stroke="#4778f5" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="40" y="906" width="560" height="188" rx="18" fill="#fff" stroke="#cfd9ea" stroke-width="2"/>
    <text x="64" y="944" fill="#17243b" font-size="24" font-weight="700">04 · Did verification pass?</text>
    <rect x="60" y="964" width="520" height="50" rx="10" fill="#e9efff"/>
    <text x="82" y="996" fill="#315ed4" font-size="21" font-weight="750">YES</text>
    <text x="152" y="996" fill="#17243b" font-size="21">Review the change and prepare handoff.</text>
    <rect x="60" y="1026" width="520" height="50" rx="10" fill="#fff7e9"/>
    <text x="82" y="1058" fill="#805816" font-size="21" font-weight="750">NO</text>
    <text x="152" y="1058" fill="#593e16" font-size="21">Classify failure; recover safely or stop.</text>
    <path d="M320 1095 V1119" stroke="#4778f5" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="50" y="1128" width="540" height="94" rx="18" fill="#e9efff" stroke="#4778f5" stroke-width="2"/>
    <text x="320" y="1167" text-anchor="middle" fill="#17243b" font-size="24" font-weight="700">Prepare a reviewable handoff</text>
    <text x="320" y="1197" text-anchor="middle" fill="#52627b" font-size="19">Stay within the user-authorized scope.</text>
    <text x="320" y="1291" text-anchor="middle" fill="#52627b" font-size="19" font-weight="650">Every route ends with evidence, recovery, or a clear handoff.</text>
  </g>
</svg>