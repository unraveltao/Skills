<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1380" role="img" aria-labelledby="title desc">
  <title id="title">Issue-to-PR workflow branches</title>
  <desc id="desc">The main workflow reads an Issue, checks the repository, confirms the cause, makes a focused change, verifies it, and prepares a handoff. Side routes clarify missing context, report an existing fix, investigate unsupported causes, or recover safely from failed verification.</desc>
  <defs>
    <marker id="arrow-main" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4778f5"/>
    </marker>
    <marker id="arrow-branch" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8493aa"/>
    </marker>
  </defs>
  <rect width="820" height="1380" rx="28" fill="#f3f6fb"/>
  <text x="42" y="56" fill="#4778f5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="750" letter-spacing="2">WORKFLOW MODEL</text>
  <text x="42" y="100" fill="#17243b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">One main route, explicit branches</text>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="287" y="132" width="246" height="70" rx="16" fill="#fff" stroke="#cfd9ea" stroke-width="2"/>
    <text x="410" y="176" text-anchor="middle" fill="#17243b" font-size="24" font-weight="700">Read the Issue</text>

    <path d="M410 203 V233" stroke="#4778f5" stroke-width="3" marker-end="url(#arrow-main)"/>
    <polygon points="410,239 540,293 410,347 280,293" fill="#e9efff" stroke="#4778f5" stroke-width="2"/>
    <text x="410" y="287" text-anchor="middle" fill="#17243b" font-size="22" font-weight="700">Enough</text>
    <text x="410" y="313" text-anchor="middle" fill="#17243b" font-size="22" font-weight="700">context?</text>
    <path d="M280 293 H244" stroke="#8493aa" stroke-width="3" marker-end="url(#arrow-branch)"/>
    <text x="250" y="278" fill="#65748a" font-size="17" font-weight="700">NO</text>
    <rect x="24" y="247" width="210" height="96" rx="14" fill="#fff7e9" stroke="#e5c58c" stroke-width="2"/>
    <text x="129" y="284" text-anchor="middle" fill="#593e16" font-size="20" font-weight="700">Clarify / pause</text>
    <text x="129" y="313" text-anchor="middle" fill="#725a35" font-size="16">Ask for missing facts</text>
    <path d="M410 348 V380" stroke="#4778f5" stroke-width="3" marker-end="url(#arrow-main)"/>
    <text x="426" y="370" fill="#315ed4" font-size="17" font-weight="700">YES</text>
    <rect x="278" y="389" width="264" height="76" rx="16" fill="#fff" stroke="#cfd9ea" stroke-width="2"/>
    <text x="410" y="420" text-anchor="middle" fill="#17243b" font-size="22" font-weight="700">Inspect repository</text>
    <text x="410" y="447" text-anchor="middle" fill="#52627b" font-size="17">Reproduce and gather evidence</text>

    <path d="M410 466 V496" stroke="#4778f5" stroke-width="3" marker-end="url(#arrow-main)"/>
    <polygon points="410,502 540,556 410,610 280,556" fill="#e9efff" stroke="#4778f5" stroke-width="2"/>
    <text x="410" y="550" text-anchor="middle" fill="#17243b" font-size="21" font-weight="700">Problem still</text>
    <text x="410" y="576" text-anchor="middle" fill="#17243b" font-size="21" font-weight="700">present?</text>
    <path d="M540 556 H576" stroke="#8493aa" stroke-width="3" marker-end="url(#arrow-branch)"/>
    <text x="548" y="541" fill="#65748a" font-size="17" font-weight="700">NO</text>
    <rect x="584" y="510" width="212" height="96" rx="14" fill="#f7f9fc" stroke="#cfd9ea" stroke-width="2"/>
    <text x="690" y="547" text-anchor="middle" fill="#17243b" font-size="19" font-weight="700">Report evidence</text>
    <text x="690" y="576" text-anchor="middle" fill="#52627b" font-size="16">Avoid duplicate changes</text>
    <path d="M410 611 V643" stroke="#4778f5" stroke-width="3" marker-end="url(#arrow-main)"/>
    <text x="426" y="633" fill="#315ed4" font-size="17" font-weight="700">YES</text>
    <polygon points="410,650 540,704 410,758 280,704" fill="#e9efff" stroke="#4778f5" stroke-width="2"/>
    <text x="410" y="698" text-anchor="middle" fill="#17243b" font-size="21" font-weight="700">Cause supported</text>
    <text x="410" y="724" text-anchor="middle" fill="#17243b" font-size="21" font-weight="700">by evidence?</text>
    <path d="M280 704 H244" stroke="#8493aa" stroke-width="3" marker-end="url(#arrow-branch)"/>
    <text x="250" y="689" fill="#65748a" font-size="17" font-weight="700">NO</text>
    <rect x="24" y="658" width="210" height="96" rx="14" fill="#fff7e9" stroke="#e5c58c" stroke-width="2"/>
    <text x="129" y="695" text-anchor="middle" fill="#593e16" font-size="19" font-weight="700">Investigate</text>
    <text x="129" y="724" text-anchor="middle" fill="#725a35" font-size="16">Or state uncertainty</text>
    <path d="M410 759 V791" stroke="#4778f5" stroke-width="3" marker-end="url(#arrow-main)"/>
    <text x="426" y="781" fill="#315ed4" font-size="17" font-weight="700">YES</text>
    <rect x="278" y="800" width="264" height="76" rx="16" fill="#fff" stroke="#cfd9ea" stroke-width="2"/>
    <text x="410" y="831" text-anchor="middle" fill="#17243b" font-size="22" font-weight="700">Make a focused fix</text>
    <text x="410" y="858" text-anchor="middle" fill="#52627b" font-size="17">Keep the change in scope</text>

    <path d="M410 877 V907" stroke="#4778f5" stroke-width="3" marker-end="url(#arrow-main)"/>
    <polygon points="410,913 540,967 410,1021 280,967" fill="#e9efff" stroke="#4778f5" stroke-width="2"/>
    <text x="410" y="961" text-anchor="middle" fill="#17243b" font-size="21" font-weight="700">Verification</text>
    <text x="410" y="987" text-anchor="middle" fill="#17243b" font-size="21" font-weight="700">passed?</text>
    <path d="M540 967 H576" stroke="#8493aa" stroke-width="3" marker-end="url(#arrow-branch)"/>
    <text x="548" y="952" fill="#65748a" font-size="17" font-weight="700">NO</text>
    <rect x="584" y="921" width="212" height="96" rx="14" fill="#fff7e9" stroke="#e5c58c" stroke-width="2"/>
    <text x="690" y="958" text-anchor="middle" fill="#593e16" font-size="18" font-weight="700">Classify failure</text>
    <text x="690" y="986" text-anchor="middle" fill="#725a35" font-size="15">Recover safely or stop</text>
    <path d="M410 1022 V1062" stroke="#4778f5" stroke-width="3" marker-end="url(#arrow-main)"/>
    <text x="426" y="1048" fill="#315ed4" font-size="17" font-weight="700">YES</text>
    <rect x="278" y="1071" width="264" height="88" rx="16" fill="#e9efff" stroke="#4778f5" stroke-width="2"/>
    <text x="410" y="1107" text-anchor="middle" fill="#17243b" font-size="21" font-weight="700">Review and hand off</text>
    <text x="410" y="1136" text-anchor="middle" fill="#52627b" font-size="16">Stay within authorization</text>

    <text x="410" y="1212" text-anchor="middle" fill="#65748a" font-size="18" font-weight="650">Every branch ends with evidence, a safe recovery, or a clear handoff.</text>
  </g>
</svg>