<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" role="img" aria-labelledby="title desc">
  <title id="title">Behavior specification map</title>
  <desc id="desc">Six connected questions define when a Skill activates, what information it needs, how it works, how it handles branches, what result it produces, and where its boundaries are.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4778f5"/>
    </marker>
  </defs>
  <rect width="640" height="900" rx="28" fill="#f3f6fb"/>
  <text x="56" y="58" fill="#4778f5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="750" letter-spacing="2">BEHAVIOR SPECIFICATION</text>
  <text x="56" y="101" fill="#17243b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="700">Turn the task into observable rules</text>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g>
      <rect x="64" y="137" width="512" height="90" rx="16" fill="#fff" stroke="#cfd9ea" stroke-width="2"/>
      <circle cx="105" cy="182" r="23" fill="#e9efff"/><text x="105" y="190" text-anchor="middle" fill="#315ed4" font-size="21" font-weight="750">1</text>
      <text x="145" y="174" fill="#17243b" font-size="23" font-weight="700">Activation</text>
      <text x="145" y="202" fill="#52627b" font-size="18">When should the Skill start?</text>
    </g>
    <path d="M320 228 V249" stroke="#4778f5" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <rect x="64" y="258" width="512" height="90" rx="16" fill="#fff" stroke="#cfd9ea" stroke-width="2"/>
      <circle cx="105" cy="303" r="23" fill="#e9efff"/><text x="105" y="311" text-anchor="middle" fill="#315ed4" font-size="21" font-weight="750">2</text>
      <text x="145" y="295" fill="#17243b" font-size="23" font-weight="700">Inputs</text>
      <text x="145" y="323" fill="#52627b" font-size="18">What information does it need?</text>
    </g>
    <path d="M320 349 V370" stroke="#4778f5" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <rect x="64" y="379" width="512" height="90" rx="16" fill="#fff" stroke="#cfd9ea" stroke-width="2"/>
      <circle cx="105" cy="424" r="23" fill="#e9efff"/><text x="105" y="432" text-anchor="middle" fill="#315ed4" font-size="21" font-weight="750">3</text>
      <text x="145" y="416" fill="#17243b" font-size="23" font-weight="700">Workflow</text>
      <text x="145" y="444" fill="#52627b" font-size="18">What actions happen, and in what order?</text>
    </g>
    <path d="M320 470 V491" stroke="#4778f5" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <rect x="64" y="500" width="512" height="90" rx="16" fill="#fff" stroke="#cfd9ea" stroke-width="2"/>
      <circle cx="105" cy="545" r="23" fill="#e9efff"/><text x="105" y="553" text-anchor="middle" fill="#315ed4" font-size="21" font-weight="750">4</text>
      <text x="145" y="537" fill="#17243b" font-size="23" font-weight="700">Branches</text>
      <text x="145" y="565" fill="#52627b" font-size="18">What changes when conditions differ?</text>
    </g>
    <path d="M320 591 V612" stroke="#4778f5" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <rect x="64" y="621" width="512" height="90" rx="16" fill="#fff" stroke="#cfd9ea" stroke-width="2"/>
      <circle cx="105" cy="666" r="23" fill="#e9efff"/><text x="105" y="674" text-anchor="middle" fill="#315ed4" font-size="21" font-weight="750">5</text>
      <text x="145" y="658" fill="#17243b" font-size="23" font-weight="700">Output</text>
      <text x="145" y="686" fill="#52627b" font-size="18">What does a good result look like?</text>
    </g>
    <path d="M320 712 V733" stroke="#4778f5" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <rect x="64" y="742" width="512" height="90" rx="16" fill="#fff" stroke="#cfd9ea" stroke-width="2"/>
      <circle cx="105" cy="787" r="23" fill="#e9efff"/><text x="105" y="795" text-anchor="middle" fill="#315ed4" font-size="21" font-weight="750">6</text>
      <text x="145" y="779" fill="#17243b" font-size="23" font-weight="700">Boundaries</text>
      <text x="145" y="807" fill="#52627b" font-size="18">What should it avoid or hand back?</text>
    </g>
  </g>
</svg>