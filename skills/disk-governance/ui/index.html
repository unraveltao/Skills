<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Disk Governors · 磁盘治理工作台</title>
<!-- The workbench server serves a fixed static whitelist and has no
     /favicon.ico route, so the browser's automatic request would 404 into the
     console. An empty data: icon keeps the console clean without touching the
     server. -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<a class="skip" href="#content">跳到主内容</a>

<aside class="sidebar" id="sidebar" aria-label="侧边导航">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">DG</span>
    <span class="brand-text"><b>Disk Governors</b><small>磁盘治理工作台</small></span>
    <button class="nav-collapse" id="navCollapse" type="button" title="收起导航" aria-label="收起导航" aria-expanded="true">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M9.5 4 5.5 8l4 4"/></svg>
    </button>
  </div>

  <nav class="nav" id="nav" aria-label="主导航">
    <button type="button" data-page="overview" aria-current="page" title="总览">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2.5" y="2.5" width="6" height="6" rx="1.4"/><rect x="11.5" y="2.5" width="6" height="6" rx="1.4"/><rect x="2.5" y="11.5" width="6" height="6" rx="1.4"/><rect x="11.5" y="11.5" width="6" height="6" rx="1.4"/></svg>
      <span class="nav-label">总览</span>
    </button>
    <button type="button" data-page="storage" title="空间浏览">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2.6 6.2c0-1 .8-1.8 1.8-1.8h3l1.5 1.8h6.7c1 0 1.8.8 1.8 1.8v6.2c0 1-.8 1.8-1.8 1.8H4.4c-1 0-1.8-.8-1.8-1.8z"/></svg>
      <span class="nav-label">空间浏览</span>
    </button>
    <button type="button" data-page="candidates" title="核验候选">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 3.4h8.4L16 7v9.6H4z"/><path d="M12 3.4V7h3.6"/><path d="M6.8 10.6h6.4M6.8 13.4h4.2"/></svg>
      <span class="nav-label">核验候选</span>
    </button>
    <button type="button" data-page="details" title="文件详情">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="9" cy="9" r="5.2"/><path d="m13 13 3.6 3.6"/></svg>
      <span class="nav-label">文件详情</span>
    </button>
    <button type="button" data-page="records" title="审计记录">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="10" r="7.2"/><path d="M10 6.2V10l2.8 1.7"/></svg>
      <span class="nav-label">审计记录</span>
    </button>
  </nav>

  <div class="side-foot"><span class="dot" aria-hidden="true"></span><span>本机只读审计 · v0.2</span></div>
</aside>

<div class="scrim" id="scrim" hidden></div>

<main class="main">
  <header class="topbar">
    <button class="drawer-btn" id="drawerBtn" type="button" aria-label="打开导航" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14"/></svg>
    </button>
    <div class="titles">
      <p class="eyebrow">Disk Governance / v0.2</p>
      <h1 id="title">磁盘概览</h1>
    </div>
    <div class="topbar-actions">
      <label class="field">
        <span>扫描批次</span>
        <select id="batches" aria-label="选择扫描批次"></select>
      </label>
    </div>
  </header>

  <section id="content" class="content" aria-live="polite" aria-busy="true">
    <div class="loading">正在读取本地扫描数据…</div>
  </section>

  <footer class="foot">文件逻辑大小、卷物理已用空间与候选逻辑大小为三种不同口径。候选只供人工核验；本工作台不提供删除或迁移操作。</footer>
</main>

<script src="/app.js" defer></script>
</body>
</html>
